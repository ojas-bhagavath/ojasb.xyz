{{ define "photonav" }}
    {{ partial "header/photonav.html" . }}
{{ end }}
{{ define "main" }}
    <section class="flex justify-center">
        {{ with .Resources.ByType "image" }}
            {{ range . }}
                <img
                    loading="lazy"
                    src="{{ .RelPermalink }}"
                    class="max-h-[85vh] max-w-full" />
            {{ end }}
        {{ end }}
    </section>
{{ end }}
