<a
    href="{{ .Destination | safeURL }}"
    {{ with .Title }}
        title="{{ . }}"
    {{ end }}
    {{ if or (strings.HasPrefix .Destination "http") (strings.HasPrefix .Destination "https") }}
        target="_blank"
    {{ end }}
    class="text-mauve underline">
    {{- .Text| safeHTML -}}
</a>
