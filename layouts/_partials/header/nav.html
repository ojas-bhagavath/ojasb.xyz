<nav
    class="bg-base flex h-[70px] w-full items-center justify-evenly px-[5vw] py-[10px]">
    <div class="flex size-[50px] grow-2 items-center justify-start">
        <a href="/" class="flex size-[50px] items-center no-underline">
            {{ partial "logos/ojasb.svg" . }}
        </a>
    </div>
    <input type="checkbox" id="sidebar" class="peer hidden" />
    <label
        for="sidebar"
        class="flex size-[32px] cursor-pointer items-center justify-center md:hidden">
        {{ partial "svg/menu.svg" . }}
    </label>
    <label
        id="overlay"
        for="sidebar"
        class="peer-checked:bg-base peer-checked:fixed peer-checked:top-0 peer-checked:left-0 peer-checked:z-10 peer-checked:size-full peer-checked:cursor-pointer peer-checked:opacity-90">
    </label>
    <div
        class="border-red fixed top-[10px] -right-[300px] flex h-screen w-[300px] flex-col justify-start border-0 border-dotted bg-inherit transition-transform duration-300 peer-checked:z-20 peer-checked:translate-x-[-100%] peer-checked:border-l-1 md:static md:right-0 md:h-auto md:w-auto md:flex-row md:justify-evenly">
        <label
            for="sidebar"
            class="bold flex size-[44px] cursor-pointer items-center justify-center bg-inherit text-inherit md:hidden">
            {{ partial "svg/close.svg" . }}
        </label>
        {{ $page := . }}
        {{ range .Site.Menus.main }}
            {{ if $page.IsMenuCurrent .Menu . }}
                <a
                    href="{{ .URL }}"
                    title="{{ .Title }}"
                    class="bg-red hover:bg-mauve flex h-[44px] w-full cursor-pointer items-center rounded-md px-[2em] text-base md:w-auto">
                    {{ .Name }}
                </a>
            {{ else }}
                <a
                    href="{{ .URL }}"
                    title="{{ .Title }}"
                    class="hover:bg-mauve flex h-[44px] w-full cursor-pointer items-center rounded-md bg-inherit px-[2em] hover:text-base md:w-auto">
                    {{ .Name }}
                </a>
            {{ end }}
        {{ end }}
        <button
            id="theme-switch"
            class="hover:bg-mauve flex h-[44px] w-full cursor-pointer flex-row items-center justify-start rounded-md bg-inherit pl-[2em] hover:text-base md:w-[44px] md:justify-center md:pl-0">
            {{ partial "svg/lightmode.svg" . }}
            {{ partial "svg/darkmode.svg" . }}
        </button>
    </div>
</nav>
