<section
    class="border-t-red flex w-full items-center justify-between border-t-[1px] border-dotted px-[10px] py-[0.4em] text-center text-[12px]">
    <div class="flex h-[14px] items-center">
        Built with
        <a
            class="ml-[0.4em] h-[14px] w-[14px]"
            target="_blank"
            href="https://gohugo.io/">
            {{ partial "logos/hugo.svg" . }}
        </a>
        , crafted on
        <a
            class="ml-[0.4em] h-[14px] w-[14px]"
            target="_blank"
            href="https://neovim.io/">
            {{ partial "logos/neovim.svg" . }}
        </a>
        , hosted on
        <a
            class="ml-[0.4em] h-[14px] w-[14px]"
            target="_blank"
            href="https://pages.cloudflare.com/">
            {{ partial "logos/cloudflarepages.svg" . }}
        </a>
        .
    </div>
    <a
        class="flex flex-row items-center gap-[0.3em] whitespace-nowrap"
        target="_blank"
        href="https://github.com/ojas-bhagavath/ojasb.xyz/blob/main/LICENSE">
        <span class="rotate-180">&copy;</span>
        {{ now.Format "2006" }}
        <div class="h-[14px] w-[20px]">
            {{ partial "logos/ojasb.svg" . }}
        </div>
    </a>
</section>
