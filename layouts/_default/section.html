{{ define "main" }}
    {{ .Content }}
    <div class="gallery">
        {{ range .Pages.ByWeight.Reverse }}
            {{ $firstImage := index (.Resources.ByType "image") 0 }}
            <div class="gallery-item">
                <a href="{{ .RelPermalink }}" title="{{ .Title }}">
                    <img
                        src="{{ $firstImage.RelPermalink }}"
                        alt="{{ .Description }}"
                    />
                </a>
            </div>
        {{ end }}
    </div>
{{ end }}
